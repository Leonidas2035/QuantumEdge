[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-edge"
version = "0.1.0"
description = "HFT Trading System Foundation"
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.18.6",
    "structlog>=24.1.0",
    "uvloop>=0.19.0",
    "numpy>=1.26.0",
    "pyzmq>=25.1.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "questdb>=2.0.0",
    "google-generativeai>=0.3.0",
    "websockets>=12.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
exclude = [".venv", "venv", "__pycache__", "build", "dist"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "PERF", "DTZ", "RUF"]
ignore = ["E501", "E402"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["quantum_edge_core", "quantum_edge_ml"]
