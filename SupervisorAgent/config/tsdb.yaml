enabled: true
backend: "questdb"  # "none" | "clickhouse" | "questdb" | "timescale"
flush_interval_seconds: 2
batch_size: 500

retry:
  max_retries: 5
  base_backoff_ms: 200
  max_backoff_ms: 5000

backfill:
  enabled: false
  from_days: 1

tables:
  prefix: "qe_"

clickhouse:
  url: "http://localhost:8123"
  database: "quantumedge"
  user: "default"
  password: ""

timescale:
  dsn: "postgresql://user:pass@localhost:5432/quantumedge"
  schema: "public"

questdb:
  ilp_http_url: "http://localhost:9000/imp"
  query_url: "http://localhost:9000/exec"

ingest:
  enabled: true
  events_path: "ai_scalper_bot/runtime/events/events.jsonl"
  metrics_path: "ai_scalper_bot/runtime/status/metrics.json"
  exec_path: "ai_scalper_bot/runtime/state/ledger.jsonl"
  state_path: "SupervisorAgent/runtime/ingest_state.json"
  max_line_kb: 256
  interval_sec: 2
  dedupe_cache_size: 5000
