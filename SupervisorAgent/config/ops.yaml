# Ops Brain v1: auto-tuning bounds + regression gate thresholds (safe defaults).

autotune:
  window_runs: 5
  min_runs: 2
  max_changes_per_run: 3
  block_rate_high: 0.4
  block_rate_low: 0.1
  winrate_high: 0.6
  winrate_low: 0.45
  trades_low: 5
  errors_max: 0
  latency_ms_high: 500
  drift_score_high: 3.0

bounds:
  guards:
    spread_bps_max: {min: 0.5, max: 5.0, step: 0.25}
    depth_usd_min: {min: 1000, max: 20000, step: 500}
    vol_burst_max: {min: 1.0, max: 10.0, step: 0.5}
    max_trades_per_hour: {min: 5, max: 120, step: 5}
  ml:
    thresholds:
      h1: {min: 0.50, max: 0.70, step: 0.01}
      h5: {min: 0.50, max: 0.70, step: 0.01}
      h15: {min: 0.50, max: 0.70, step: 0.01}
  execution:
    passive_offset_bps: {min: 0.2, max: 1.5, step: 0.1}
    passive_ttl_ms: {min: 500, max: 3000, step: 100}
    max_requotes: {min: 0, max: 3, step: 1}

regression_gates:
  max_regime_flaps_per_min: 2.0
  max_flap_increase_pct: 0.2
  max_blocked_increase_pct: 0.3
  max_actions_rejected_increase_pct: 0.3
  max_errors_increase: 1
  max_critical_blocks_increase_pct: 0.2
  pnl_tolerance_pct: 0.1
  smoke_max_episodes: 5
  smoke_seed: 42
