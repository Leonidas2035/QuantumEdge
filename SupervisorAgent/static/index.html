<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuantumEdge Supervisor Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>QuantumEdge Operator Dashboard</h1>
        <div class="muted" id="connection-status">Connecting...</div>
      </div>
      <div class="auth-box">
        <label for="auth-token">Auth token</label>
        <input id="auth-token" type="password" placeholder="DASHBOARD_TOKEN (optional)" />
        <button id="save-token">Save</button>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Summary</h2>
        <div class="summary-grid">
          <div>
            <div class="label">Mode</div>
            <div id="summary-mode" class="value">-</div>
          </div>
          <div>
            <div class="label">Autopilot</div>
            <div id="summary-autopilot" class="value">-</div>
          </div>
          <div>
            <div class="label">Health</div>
            <div id="summary-health" class="value">-</div>
          </div>
          <div>
            <div class="label">Breaker</div>
            <div id="summary-breaker" class="value">-</div>
          </div>
          <div>
            <div class="label">Tick age</div>
            <div id="summary-tick-age" class="value">-</div>
          </div>
          <div>
            <div class="label">Book age</div>
            <div id="summary-book-age" class="value">-</div>
          </div>
          <div>
            <div class="label">Ingest lag</div>
            <div id="summary-ingest-lag" class="value">-</div>
          </div>
          <div>
            <div class="label">Policy</div>
            <div id="summary-policy" class="value">-</div>
          </div>
        </div>
        <div class="muted" id="summary-updated">-</div>
      </section>

      <section class="card">
        <h2>Alerts</h2>
        <div id="alerts-active" class="list"></div>
        <div class="muted">Recent alerts</div>
        <div id="alerts-recent" class="list compact"></div>
      </section>

      <section class="card">
        <h2>Controls</h2>
        <div class="controls">
          <div class="control-row">
            <button id="autopilot-enable">Enable Autopilot</button>
            <button id="autopilot-disable" class="secondary">Disable Autopilot</button>
          </div>
          <div class="control-row">
            <label for="target-state">Target state</label>
            <select id="target-state">
              <option value="OFF">OFF</option>
              <option value="SHADOW">SHADOW</option>
              <option value="LIVE_DEMO">LIVE_DEMO</option>
              <option value="LIVE">LIVE</option>
            </select>
            <button id="set-target">Apply</button>
          </div>
          <div class="control-row">
            <label for="policy-path">Policy rollout path</label>
            <input id="policy-path" type="text" placeholder="artifacts/policy/BTCUSDT/policy.json" />
            <button id="policy-rollout">Rollout</button>
            <button id="policy-rollback" class="secondary">Rollback</button>
          </div>
          <div class="control-row danger">
            <label for="kill-switch">Kill switch</label>
            <button id="kill-switch-toggle" class="danger">Toggle</button>
            <span class="muted">Requires confirmation</span>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Charts</h2>
        <div class="chart-grid">
          <div>
            <div class="label">Inference p95 (ms)</div>
            <div id="chart-inference" class="chart"></div>
          </div>
          <div>
            <div class="label">Tick age (ms)</div>
            <div id="chart-tick-age" class="chart"></div>
          </div>
          <div>
            <div class="label">Book age (ms)</div>
            <div id="chart-book-age" class="chart"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Recent Events</h2>
        <div id="events-recent" class="list compact"></div>
      </section>

      <section class="card">
        <h2>Audit Trail</h2>
        <div id="audit-recent" class="list compact"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
