projects:
  - id: "meta_agent"
    root: "src/quantum_edge_infra/automation/meta_agent"
    label: "Meta-Agent"
    default_include_globs:
      - "**/*.py"
      - "**/*.md"
      - "docs/**/*.md"
      - "examples/**/*.yaml"
    deny_globs:
      - "**/.git/**"
      - "**/venv/**"
      - "**/.venv/**"
      - "**/runtime/**"
      - "**/artifacts/**"
      - "**/*.env"
      - "**/secrets*"
