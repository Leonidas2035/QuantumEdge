    root: "src/quantum_edge_core/supervisor"
    label: "Supervisor Agent"
    default_include_globs:
      - "**/*.py"
      - "**/*.md"
    deny_globs:
      - "**/.git/**"
      - "**/venv/**"
      - "**/.venv/**"
      - "**/runtime/**"
      - "**/artifacts/**"
      - "**/*.env"
      - "**/secrets*"
  - id: "quantumedge_core"
    root: "src/quantum_edge_core"
    label: "QuantumEdge Core"
    default_include_globs:
      - "**/*.py"
      - "**/*.md"
  - id: "quantumedge_infra"
    root: "src/quantum_edge_infra"
    label: "QuantumEdge Infra"
  - id: "quantumedge_ml"
    root: "src/quantum_edge_ml"
    label: "QuantumEdge ML"
