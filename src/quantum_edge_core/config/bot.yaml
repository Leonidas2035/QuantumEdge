# QuantumEdge bot defaults (safe, no secrets).

app:
  mode: "paper"          # paper | demo
  websocket: "mock"      # mock | binance
  log_level: "INFO"
  llm_enabled: false
  exchange: "mock"
  data_path: "data"

exchange:
  name: "mock"           # mock | paper
  mode: "simulation"     # backtest | simulation

enabled_market: "spot"
futures_enabled: false

market_data:
  source: "hub"  # ws | mock | hub
  hub:
    pub_endpoint: "ipc:///tmp/quantum_market_data.ipc"
    snapshot_endpoint: "ipc:///tmp/quantum_market_snapshot.ipc"
    rcvhwm: 1000
    conflate_l1: true
    topics: []

binance:
  base_url: "https://api.binance.com"
  ws_spot_base: "wss://stream.binance.com:9443"
  recv_window: 5000
  symbols: ["BTCUSDT", "ETHUSDT"]

binance_demo:
  enabled: true
  testnet: true
  symbols: ["BTCUSDT", "ETHUSDT"]
  max_notional_per_trade: 50
  max_open_positions: 1

bingx_demo:
  enabled: true
  symbols: ["BTC-USDT"]
  allow_trading_demo: false
  allow_place_test_order: false
  healthcheck_only: false
  recv_window: 5000
  max_notional_per_trade: 50
  max_open_positions: 1

ml:
  enabled: true
  require_models: false
  ml_required: false
  ml_compat_strict: false
  fail_mode: "disable"   # disable | block
  model_source: "runtime"   # runtime | legacy
  runtime_models_dir: "runtime/models"
  inference_backend: "auto"  # auto | cpu | onnx_cuda | torch_cuda
  inference_batch_size: 0
  inference_batch_window_ms: 0
  thresholds:
    h1: 0.55
    h5: 0.55
    h15: 0.55
  horizons: [1, 5, 15]
  warmup_seconds: 600
  snapshot_interval_sec: 30
  drift:
    window: 300
    z_threshold: 3.0

supervisor:
  enabled: true
  base_url: "http://127.0.0.1:8765"
  api_token: ""
  heartbeat_interval_s: 5
  timeout_s: 1.0
  on_error: "log_and_continue"
  risk_enabled: true
  risk_on_error: "bypass"
  risk_log_level: "info"

policy:
  policy_source: "auto"  # file | api | auto
  policy_file_path: "runtime/policy.json"
  policy_api_url: "http://127.0.0.1:8765/api/v1/policy/current"
  policy_api_timeout_s: 0.3
  policy_ttl_grace_sec: 0
  safe_mode_default: "risk_off"

ops:
  status_file: "runtime/bot_status.json"
  write_interval_seconds: 2

cpu:
  pin_enable: false
  pin_mode: "auto_pcores"   # auto_pcores | explicit
  pin_cpus: ""              # e.g. "0-3,8-11" when pin_mode=explicit
  pin_max_cores: 0          # 0 = all detected p-cores

workers:
  marketdata: 0
  feature: 0
  execution: 0
  supervisor_web: 0

telemetry:
  enabled: true
  sink: "http"  # http | file | both
  http_url: "http://127.0.0.1:8765/api/v1/telemetry/ingest"
  file_path: "runtime/telemetry.jsonl"
  flush_interval_sec: 1
  sample:
    latency_every_n: 10

microstructure:
  enabled: true
  max_age_ms: 2000
  publish_topic_suffix: "microstructure.v1"

spot_scalper:
  enabled: false
  symbols: ["BTCUSDT"]
  thresholds:
    max_spread_bps: 2.0
    max_short_vol_bps: 15.0
    trend_threshold: 0.0005
    imbalance_threshold: 0.1
    vol_window: 30
    ema_fast: 5
    ema_slow: 20
  fees:
    fee_bps: 5.0
    slippage_bps: 1.0
  execution:
    ttl_ms: 800
    max_requotes: 3
    tick_size: 0.01
    min_qty: 0.001
  risk:
    risk_per_trade: 0.01
    daily_dd_limit: 0.03
    max_consecutive_errors: 5
    spread_kill_bps: 10.0
    equity_usd: 0.0
  events_path: "runtime/events/spot_scalper.jsonl"
  status_file: "runtime/status/spot_scalper.json"

execution:
  mode: "normal"          # normal | scalp
  shadow: false
  scalp:
    enabled: false
    entry_gate:
      enabled: false
      ofi_ma5_threshold: 0.0
      p_up_h1: 0.0
      p_up_h5: 0.0
      require_microstructure: false
    smart_executor:
      enabled: false
      require_book: true
      market: "usdm"
      order_policy: "maker_first"
      fallback_policy: "aggressive_limit"
