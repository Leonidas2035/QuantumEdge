# Global QuantumEdge defaults (no secrets).
supervisor:
  host: "127.0.0.1"
  port: 8765

orchestrator:
  supervisor_spawns_bot: true
  supervisor_health_path: "/api/v1/dashboard/health"
  supervisor_health_fallbacks:
    - "/api/v1/status"
    - "/"
  startup_timeout_s: 30
  poll_interval_s: 1

market_data:
  binance:
    http_base: "https://testnet.binance.vision"
    wss_base: "wss://testnet.binance.vision/ws"
    futures:
      http_base: "https://testnet.binancefuture.com"
      wss_base: "wss://stream.binancefuture.com/ws"
