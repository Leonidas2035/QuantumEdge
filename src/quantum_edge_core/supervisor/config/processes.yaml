version: 1
defaults:
  env:
    PYTHONUNBUFFERED: "1"
  restart:
    enabled: true
    max_retries: 5
    backoff_s: [1, 2, 4, 8, 16]
    cooldown_s: 30

processes:
  hub:
    enabled: false
    cwd: "market_data"
    cmd: ["python", "-m", "market_data.hub"]
    env:
      HUB_LOG_LEVEL: "INFO"
    healthcheck:
      type: "http"
      url: "http://127.0.0.1:8700/health"
      timeout_s: 2
    ports: [8700, 5555]
  bot_qe_1:
    enabled: false
    cwd: "../.."
    cmd: ["python", "QuantumEdge.py", "run", "--profile", "qe1"]
    env:
      QE_MODE: "scalp"
    healthcheck:
      type: "tcp"
      host: "127.0.0.1"
      port: 8765
      timeout_s: 1
