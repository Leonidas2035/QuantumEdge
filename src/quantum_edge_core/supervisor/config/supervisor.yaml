# Supervisor runtime configuration.

mode: "paper"  # paper | demo | off
exchange: bingx_swap   # optional: set to "bingx_swap" to pass EXCHANGE env to QuantumEdge
heartbeat_port: 8765
heartbeat_timeout_s: 15
restart_max_attempts: 3
restart_backoff_s: 5

# HTTP API settings (SupervisorAgent ⇄ QuantumEdge)
api_enabled: true
api_host: "127.0.0.1"
# API listens on heartbeat_port
api_auth_token: ""  # optional shared secret; empty disables auth
processes_file: "config/processes.yaml"
events_retention_days: 7

snapshots:
  enabled: true
  interval_minutes: 5
  history_window_minutes: 15

# Policy publishing (Supervisor -> bot)
policy:
  update_interval_sec: 5
  ttl_sec: 30
  file_path: "runtime/policy.json"
  allow_trading: true
  mode: "normal"
  size_multiplier: 1.0
  cooldown_sec: 0
  spread_max_bps: null
  max_daily_loss: null
  reason: "OK"
  hysteresis:
    enter_cycles: 2
    exit_cycles: 3
  thresholds:
    max_daily_loss: null
    max_drawdown_abs: null
    loss_streak: 3
    spread_max_bps: null
    volatility_hi: null
    restart_rate: 3.0
    conservative_size_multiplier: 0.5
    loss_streak_mode: "conservative"

llm:
  enabled: true
  model: "gemini-3-flash"
  api_url: "https://generativelanguage.googleapis.com/v1beta/models"
  api_key_env: "GOOGLE_API_KEY"
  timeout_sec: 4
  temperature: 0.1
  circuit_breaker:
    failures: 3
    window_sec: 300
    open_sec: 120

telemetry:
  ingest:
    max_event_size_kb: 32
  store:
    max_events_in_memory: 5000
    persist_path: "runtime/telemetry_store.jsonl"
  alerts:
    cooldown_sec: 120
    thresholds:
      error_rate_1m: 5
      latency_ms: 500
      drawdown_abs: null
      max_daily_loss: null
      restart_rate_per_hour: 3.0
