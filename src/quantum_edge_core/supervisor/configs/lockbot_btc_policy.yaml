enabled: false
symbol: "BTCUSDT"

hub_sub_endpoint: "ipc:///tmp/quantum_market_data.ipc"
hub_topics:
  - "BTCUSDT:mark_price_1s"
  - "BTCUSDT:ohlcv_5m"
  - "BTCUSDT:ohlcv_15m"
  - "BTCUSDT:vwap_bands_d"
  - "BTCUSDT:avwap"
  - "BTCUSDT:liq_heatmap"
  - "BTCUSDT:funding_rate"

tick_interval_ms: 1000
max_market_lag_ms: 3000
max_account_lag_ms: 8000
stale_action: "PAUSE"

max_cmds_per_sec: 2
max_exec_steps_per_minute: 6
max_cmds_per_tick: 1
cooldown_after_reject_ms: 2000
min_leg_qty: 0.001
execution_enabled: false
reject_pause_threshold: 5
audit_log_path: "runtime/lockbot_policy_decisions.jsonl"

regime:
  adx_period: 14
  atr_period: 14
  atr_baseline_period: 50
  ema_fast: 8
  ema_slow: 21
  trend_adx_enter: 25
  trend_adx_exit: 20
  slope_bps_enter: 6
  chaos_atr_mult: 2.0
  chaos_liq_intensity: 5.0
  chaos_band_bps: 120
  min_regime_hold_s: 60
  confirm_cycles: 2

range:
  target: 0.0
  band_low: -0.08
  band_high: 0.08
  step_qty_hint: 0.01
  heatmap_block: 4.0
  funding_max_abs: 0.0005
  min_edge_bps: 2.0

trend:
  target_up: 0.35
  target_down: -0.35
  band_low: -0.6
  band_high: 0.6
  step_qty_hint: 0.02
  pullback_bps: 35.0
  heatmap_block: 6.0
  funding_max_abs: 0.0008
  min_edge_bps: 2.5
  target_refresh_s: 30
  avwap_anchor_preference:
    - "trend_start"
    - "lock_entry"
    - "liq_sweep"
