version: "scenarios.v1"
scenarios:
  - id: "S01"
    name: "Range Micro-Chop"
    description: "Tight range with low volatility and tight spread."
    tags: ["RANGE", "MICROSTRUCTURE"]
    detect:
      window_s: 5
      volatility_bps_max: 6
      spread_bps_max: 5
      trade_rate_min: 5
      min_gap_s: 30
    pre_roll_s: 10
    event_window_s: 30
    post_roll_s: 10
  - id: "S02"
    name: "Range Normal"
    description: "Low-volatility range with moderate trade rate."
    tags: ["RANGE"]
    detect:
      window_s: 10
      volatility_bps_max: 8
      trade_rate_min: 3
      min_gap_s: 60
    pre_roll_s: 15
    event_window_s: 45
    post_roll_s: 15
  - id: "S03"
    name: "Trend Up"
    description: "Sustained upward move over the detection window."
    tags: ["TREND", "UP"]
    detect:
      window_s: 10
      return_bps_min: 15
      direction: "up"
      min_gap_s: 60
    pre_roll_s: 20
    event_window_s: 60
    post_roll_s: 20
  - id: "S04"
    name: "Trend Down"
    description: "Sustained downward move over the detection window."
    tags: ["TREND", "DOWN"]
    detect:
      window_s: 10
      return_bps_min: 15
      direction: "down"
      min_gap_s: 60
    pre_roll_s: 20
    event_window_s: 60
    post_roll_s: 20
  - id: "S05"
    name: "Volatility Spike"
    description: "Rapid volatility expansion."
    tags: ["PANIC", "VOLATILITY"]
    detect:
      window_s: 5
      volatility_bps_min: 20
      min_gap_s: 60
    pre_roll_s: 10
    event_window_s: 20
    post_roll_s: 10
  - id: "S06"
    name: "Spread Blowout"
    description: "Spread widens beyond typical bounds."
    tags: ["MICROSTRUCTURE", "SPREAD"]
    detect:
      window_s: 3
      spread_bps_min: 20
      min_gap_s: 45
    pre_roll_s: 10
    event_window_s: 20
    post_roll_s: 10
  - id: "S07"
    name: "Trade Rate Surge"
    description: "Trade rate spikes, indicating bursty flow."
    tags: ["FLOW", "BURST"]
    detect:
      window_s: 5
      trade_rate_min: 20
      min_gap_s: 45
    pre_roll_s: 10
    event_window_s: 20
    post_roll_s: 10
  - id: "S08"
    name: "Trade Rate Drought"
    description: "Trade rate collapses (illiquidity)."
    tags: ["FLOW", "ILLQ"]
    detect:
      window_s: 10
      trade_rate_max: 1
      min_gap_s: 60
    pre_roll_s: 15
    event_window_s: 30
    post_roll_s: 15
  - id: "S09"
    name: "Mean Reversion Snap"
    description: "Sharp move that snaps back quickly."
    tags: ["MEAN_REVERT"]
    detect:
      window_s: 5
      return_bps_min: 12
      volatility_bps_max: 15
      min_gap_s: 60
    pre_roll_s: 10
    event_window_s: 25
    post_roll_s: 10
  - id: "S10"
    name: "Gap Up"
    description: "Abrupt upward gap."
    tags: ["GAP", "UP"]
    detect:
      window_s: 1
      return_bps_min: 30
      direction: "up"
      min_gap_s: 60
    pre_roll_s: 5
    event_window_s: 15
    post_roll_s: 5
  - id: "S11"
    name: "Gap Down"
    description: "Abrupt downward gap."
    tags: ["GAP", "DOWN"]
    detect:
      window_s: 1
      return_bps_min: 30
      direction: "down"
      min_gap_s: 60
    pre_roll_s: 5
    event_window_s: 15
    post_roll_s: 5
  - id: "S12"
    name: "Whipsaw"
    description: "High volatility with low net displacement."
    tags: ["WHIPSAW"]
    detect:
      window_s: 10
      volatility_bps_min: 15
      return_bps_max: 5
      min_gap_s: 60
    pre_roll_s: 10
    event_window_s: 30
    post_roll_s: 10
  - id: "S13"
    name: "Panic Flush"
    description: "Fast downward shock with high volatility."
    tags: ["PANIC", "DOWN"]
    detect:
      window_s: 3
      return_bps_min: 40
      direction: "down"
      volatility_bps_min: 20
      min_gap_s: 90
    pre_roll_s: 10
    event_window_s: 20
    post_roll_s: 10
  - id: "S14"
    name: "Panic Spike Up"
    description: "Fast upward shock with high volatility."
    tags: ["PANIC", "UP"]
    detect:
      window_s: 3
      return_bps_min: 40
      direction: "up"
      volatility_bps_min: 20
      min_gap_s: 90
    pre_roll_s: 10
    event_window_s: 20
    post_roll_s: 10
  - id: "S15"
    name: "Liquidity Thin"
    description: "Wide spread with low trade rate."
    tags: ["LIQUIDITY"]
    detect:
      window_s: 10
      spread_bps_min: 15
      trade_rate_max: 2
      min_gap_s: 90
    pre_roll_s: 15
    event_window_s: 30
    post_roll_s: 15
  - id: "S16"
    name: "Calm Recovery"
    description: "Quiet range after turbulence."
    tags: ["RECOVERY", "RANGE"]
    detect:
      window_s: 10
      volatility_bps_max: 5
      spread_bps_max: 5
      return_bps_max: 5
      min_gap_s: 120
    pre_roll_s: 20
    event_window_s: 40
    post_roll_s: 20
  - id: "S17"
    name: "Micro Trend Up"
    description: "Small but persistent upward drift."
    tags: ["TREND", "UP", "MICRO"]
    detect:
      window_s: 5
      return_bps_min: 6
      direction: "up"
      min_gap_s: 45
    pre_roll_s: 10
    event_window_s: 25
    post_roll_s: 10
  - id: "S18"
    name: "Micro Trend Down"
    description: "Small but persistent downward drift."
    tags: ["TREND", "DOWN", "MICRO"]
    detect:
      window_s: 5
      return_bps_min: 6
      direction: "down"
      min_gap_s: 45
    pre_roll_s: 10
    event_window_s: 25
    post_roll_s: 10
  - id: "S19"
    name: "Reversal Up"
    description: "Quick reversal to the upside."
    tags: ["REVERSAL", "UP"]
    detect:
      window_s: 2
      return_bps_min: 12
      direction: "up"
      volatility_bps_min: 10
      min_gap_s: 60
    pre_roll_s: 8
    event_window_s: 20
    post_roll_s: 8
  - id: "S20"
    name: "Reversal Down"
    description: "Quick reversal to the downside."
    tags: ["REVERSAL", "DOWN"]
    detect:
      window_s: 2
      return_bps_min: 12
      direction: "down"
      volatility_bps_min: 10
      min_gap_s: 60
    pre_roll_s: 8
    event_window_s: 20
    post_roll_s: 8
  - id: "S21"
    name: "Volatility Compression"
    description: "Sustained low volatility."
    tags: ["VOLATILITY", "LOW"]
    detect:
      window_s: 10
      volatility_bps_max: 3
      min_gap_s: 120
    pre_roll_s: 15
    event_window_s: 40
    post_roll_s: 15
  - id: "S22"
    name: "Volatility Expansion"
    description: "Broad volatility expansion."
    tags: ["VOLATILITY", "HIGH"]
    detect:
      window_s: 10
      volatility_bps_min: 12
      min_gap_s: 120
    pre_roll_s: 15
    event_window_s: 40
    post_roll_s: 15
  - id: "S23"
    name: "Range with Wide Spread"
    description: "Low volatility but wider spreads."
    tags: ["RANGE", "SPREAD"]
    detect:
      window_s: 10
      volatility_bps_max: 6
      spread_bps_min: 10
      min_gap_s: 120
    pre_roll_s: 15
    event_window_s: 35
    post_roll_s: 15
  - id: "S24"
    name: "Momentum Exhaustion"
    description: "High activity with little net movement."
    tags: ["MOMENTUM", "EXHAUSTION"]
    detect:
      window_s: 10
      trade_rate_min: 30
      return_bps_max: 3
      volatility_bps_min: 10
      min_gap_s: 90
    pre_roll_s: 10
    event_window_s: 30
    post_roll_s: 10
  - id: "S25"
    name: "Flash Move"
    description: "Very fast large move in a short window."
    tags: ["FLASH", "SHOCK"]
    detect:
      window_s: 1
      return_bps_min: 60
      direction: "any"
      min_gap_s: 120
    pre_roll_s: 5
    event_window_s: 15
    post_roll_s: 5
