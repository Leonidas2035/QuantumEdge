# LLM Supervisor configuration (Stage 4).
# Controls periodic AI moderation of trading behavior.

enabled: true
api_url: "https://openrouter.ai/api/v1/chat/completions"
model: "openai/gpt-oss-120b:free"
api_key_env: "OPENROUTER_API_KEY"
check_interval_minutes: 1
min_order_decisions: 0      # ЗМІНЕНО ДЛЯ UAT: дозволяє LLM аналізувати відразу
max_events_in_summary: 50
max_trades_in_table: 20
timeout_seconds: 60
dry_run: false              # КРИТИЧНО ДЛЯ UAT: дозволяє відправляти команди (Command Bus)

trust_policy:
  allow_risk_multiplier: true
  allow_mode_switch: false
  allow_pause: true
  min_multiplier: 0.2
  max_multiplier: 1.0

