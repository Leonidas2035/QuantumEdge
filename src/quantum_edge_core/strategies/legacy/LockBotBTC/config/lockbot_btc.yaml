bot_id: "LockBotBTC"
symbol: "BTCUSDT"

hub_sub_endpoint: "ipc:///tmp/quantum_market_data.ipc"
supervisor_cmd_sub_endpoint: "ipc:///tmp/lockbot_cmd.ipc"
bot_pub_endpoint: "ipc:///tmp/lockbot_status.ipc"

market_topics:
  - "BTCUSDT:mark_price_1s"
  - "BTCUSDT:vwap_d"
  - "BTCUSDT:vwap_bands_d"
  - "BTCUSDT:avwap"
  - "BTCUSDT:liq_heatmap"

account_topics:
  - "account:snapshot"
  - "account:delta:usdm_ws"
  - "account:delta:usdm"

heartbeat_interval_ms: 1000
cmd_ttl_ms: 2000
cmd_cache_size: 256

log_level: "INFO"
log_path: "runtime/lockbot_btc.log"

ddn:
  profiles:
    neutral:
      target: 0.0
      band_low: -0.10
      band_high: 0.10
    trend:
      target: 0.0
      band_low: -0.60
      band_high: 0.60
    panic:
      target: 0.0
      band_low: -0.05
      band_high: 0.05
      force_hedge: true
  max_band_abs: 0.8
  max_margin_usage: 0.5
  min_distance_to_liq_bps: 250
  max_step_notional_usd: 5000
  min_step_notional_usd: 50
  max_steps_per_minute: 6
  cooldown_ms_after_reject: 1000
  panic_on_lag_ms: 5000
  taker_fee_bps: 7.5
  maker_fee_bps: 2.0
  expected_slippage_bps_market: 5.0
  funding_weight: 1.0
  min_expected_edge_bps: 1.0
  max_cost_bps_per_step: 20.0
  volatility_window: 30
  step_volatility_scale: 1.0

execution:
  mode: "DRY_RUN"
  auto_submit_on_allow: false
  allow_live_mainnet: false
  symbol_whitelist: ["BTCUSDT"]
  max_open_orders: 5
  ack_timeout_ms: 8000
  stale_account_ms: 8000
  error_threshold: 3
  allow_reduce_only_in_panic: true
  ledger_path: "runtime/lockbot_exec_ledger.jsonl"
  api_key_env: "BINANCE_DEMO_API_KEY"
  api_secret_env: "BINANCE_DEMO_API_SECRET"
  base_url: "https://testnet.binancefuture.com"
  recv_window: 5000
