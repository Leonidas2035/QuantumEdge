# QuestDB server.conf (conservative baseline for 16GB).
# Tune in Stage 7 after load testing.

# Worker threads
shared.worker.count=4

# Reduce uncommitted rows to bound memory during bursts
cairo.max.uncommitted.rows=10000
cairo.commit.lag=1000

# Keep out-of-order (O3) memory bounded
cairo.o3.max.lag=60000
cairo.o3.min.lag=1000
