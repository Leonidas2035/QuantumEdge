name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src/quantum_edge_core/strategies/scalper_v1:src:src/quantum_edge_core:src/quantum_edge_infra:src/quantum_edge_ml:src/quantum_edge_core/ai_scalper_bot:/home/korben/.hermes/hermes:src/quantum_edge_infra/automation/meta_agent:.
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt
          python -m pip install -r requirements/requirements-dev.txt
      - name: Lint (ruff)
        run: |
          python -m ruff check src scripts tests QuantumEdge.py
      - name: Format (black)
        run: |
          python -m black --check src scripts tests QuantumEdge.py
      - name: Unit tests
        run: |
          python -m pytest -q
      - name: Offline smoke (research backtest)
        run: |
          python /home/korben/.hermes/hermes/supervisor.py research backtest --data_file tests/data/ticks_small.csv --limit_rows 200 --no_equity_curve --no_trades
      - name: TSDB benchmark (noop)
        run: |
          python src/quantum_edge_infra/tools/load/run_ingestion_benchmark.py --duration-sec 5 --writer-mode noop --trades-per-sec 5 --l1-per-sec 5 --no-spool
