name: pytest

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:src/quantum_edge_core:src/quantum_edge_infra:src/quantum_edge_ml:src/quantum_edge_core/ai_scalper_bot:src/quantum_edge_core/strategies/scalper_v1:src/quantum_edge_core/strategies/legacy/lockbot:src/quantum_edge_core/supervisor:src/quantum_edge_core/supervisor/supervisor:src/quantum_edge_infra/automation/meta_agent:.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt
          python -m pip install -r requirements/requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check src scripts tests QuantumEdge.py

  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:src/quantum_edge_core:src/quantum_edge_infra:src/quantum_edge_ml:src/quantum_edge_core/ai_scalper_bot:src/quantum_edge_core/strategies/scalper_v1:src/quantum_edge_core/strategies/legacy/lockbot:src/quantum_edge_core/supervisor:src/quantum_edge_core/supervisor/supervisor:src/quantum_edge_infra/automation/meta_agent:.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt
          python -m pip install -r requirements/requirements-dev.txt
      - name: Run pytest
        run: |
          python -m pytest -q
      - name: Docs check
        run: |
          python scripts/docs_check.py

  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:src/quantum_edge_core:src/quantum_edge_infra:src/quantum_edge_ml:src/quantum_edge_core/ai_scalper_bot:src/quantum_edge_core/strategies/scalper_v1:src/quantum_edge_core/strategies/legacy/lockbot:src/quantum_edge_core/supervisor:src/quantum_edge_core/supervisor/supervisor:src/quantum_edge_infra/automation/meta_agent:.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt
          python -m pip install -e .
      - name: Smoke E2E
        run: |
          python src/quantum_edge_infra/tools/smoke_e2e.py
