name: pytest

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check --ignore E501 scripts tools src/quantum_edge_core/supervisor/supervisor/alerts src/quantum_edge_core/supervisor/supervisor/security.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt
          python -m pip install -r requirements/requirements-dev.txt
      - name: Run pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src:$(pwd)/src/quantum_edge_core:$(pwd)/src/quantum_edge_infra:$(pwd)/src/quantum_edge_ml
          python -m pytest -q
      - name: Docs check
        run: |
          python scripts/docs_check.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Smoke E2E
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src:$(pwd)/src/quantum_edge_core:$(pwd)/src/quantum_edge_infra:$(pwd)/src/quantum_edge_ml
          python src/quantum_edge_infra/tools/smoke_e2e.py
