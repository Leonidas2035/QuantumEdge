# LockBot DDN Configuration
bot_id: "LockBotBTC"
symbol: "BTCUSDT"
log_level: "INFO"
log_path: "logs/lockbot.log"

# Infrastructure
hub_sub_endpoint: "tcp://127.0.0.1:5555"
supervisor_policy_sub_endpoint: "tcp://127.0.0.1:5556"
bot_pub_endpoint: "tcp://127.0.0.1:5557"

# Execution (Binance Futures Testnet)
# API keys must be loaded from ENV:
#   export BINANCE_TESTNET_API_KEY=<your-key>
#   export BINANCE_TESTNET_API_SECRET=<your-secret>
execution:
  api_key_env: "BINANCE_TESTNET_API_KEY"
  api_secret_env: "BINANCE_TESTNET_API_SECRET"
  base_url: "https://testnet.binancefuture.com"
  dry_run: false
  max_margin_usage: 0.5  # 50% Margin Guard
  leverage: 10

# DDN Strategy Parameters
ddn:
  volatility_window: 20
  atr_period: 14
  panic_atr_multiplier: 2.5
  min_step_notional_usd: 100.0
  max_step_notional_usd: 5000.0
  max_steps_per_minute: 10
  cooldown_ms_after_reject: 1000
  panic_on_lag_ms: 5000
  min_distance_to_liq_bps: 200
  taker_fee_bps: 4.0
  maker_fee_bps: 2.0
  expected_slippage_bps_market: 5.0
  
  # Scalping (Bollinger Bands)
  scalping:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    
  profiles:
    neutral:
      name: "neutral"
      target: 0.0
      band_low: -0.05
      band_high: 0.05
    trend:
      name: "trend"
      target: 0.0
      band_low: -0.2
      band_high: 0.2
