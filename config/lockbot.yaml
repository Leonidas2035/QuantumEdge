# config/lockbot.yaml
bot_id: "LockBotBTC"
symbol: "BTCUSDT"

# Hub IPC endpoints
hub_sub_endpoint: "ipc:///tmp/quantum_market_data.ipc"
supervisor_cmd_sub_endpoint: "ipc:///tmp/lockbot_cmd.ipc"
bot_pub_endpoint: "ipc:///tmp/lockbot_status.ipc"

log_level: "INFO"
log_path: "logs/lockbot_btc.log"

ddn:
  max_band_abs: 0.8
  max_margin_usage: 0.5   # 50% max margin guard
  max_volatility_bps_atr: 120.0 # Trigger Panic Lock threshold
  min_distance_to_liq_bps: 300.0
  max_step_notional_usd: 5000.0
  min_step_notional_usd: 100.0
  max_steps_per_minute: 10
  cooldown_ms_after_reject: 1500
  taker_fee_bps: 5.0
  maker_fee_bps: 2.0
  step_volatility_scale: 1.5
  profiles:
    neutral:
      target: 0.0
      band_low: -0.15
      band_high: 0.15
    trend:
      target: 0.0
      band_low: -0.40
      band_high: 0.40
    panic:
      target: 0.0
      band_low: -0.05
      band_high: 0.05
      force_hedge: true

execution:
  mode: "DRY_RUN"  # Use DRY_RUN by default
  auto_submit_on_allow: true
  allow_live_mainnet: false
  symbol_whitelist:
    - "BTCUSDT"
  max_open_orders: 10
  ack_timeout_ms: 3000
  error_threshold: 5
  allow_reduce_only_in_panic: true
  ledger_path: "logs/lockbot_exec_ledger.jsonl"
  api_key_env: "TESTNET_API_KEY"
  api_secret_env: "TESTNET_API_SECRET"
  base_url: "https://testnet.binancefuture.com"
  recv_window: 5000
