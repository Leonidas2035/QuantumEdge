version: 1
disable_existing_loggers: False
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    level: INFO
    filename: "logs/quantum_edge.log"
    mode: "a"
    encoding: "utf-8"
    maxBytes: 52428800
    backupCount: 5
root:
  level: INFO
  handlers: [console, file]
